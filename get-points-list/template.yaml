AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  python3.14

  Sample SAM Template for get-points-list

Globals:
  Function:
    Timeout: 900
    MemorySize: 3008
    Runtime: python3.14
    Architectures:
      - x86_64

Resources:
  GetPointsListFunction:
    Type: AWS::Serverless::Function 
    Properties:
      Handler: app.lambda_handler
      CodeUri: src/
      # No event source. The nightly run is an EventBridge Scheduler schedule
      # (get-fis-points-nightly-run) that invokes this function directly. There
      # used to be an unauthenticated API Gateway here; nothing called it, and it
      # was a public trigger for a 900s/3008MB function that scans and rewrites
      # DynamoDB. Removed 2026-08-21.

Outputs:
  GetPointsListFunction:
    Description: "GetPointsList Lambda Function ARN"
    Value: !GetAtt GetPointsListFunction.Arn
  GetPointsListFunctionIamRole:
    Description: "Implicit IAM Role created for GetPointsList function"
    Value: !GetAtt GetPointsListFunctionRole.Arn
